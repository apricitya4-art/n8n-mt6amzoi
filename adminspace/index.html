<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/config.js"></script><script src="../assets/defaults.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:#f7ecef;color:#3a2530}
button,input,textarea{font:inherit}input,textarea{width:100%;padding:8px;border:1px solid #e3c4cf;border-radius:8px;background:#fff}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:linear-gradient(135deg,#6b2c3e,#c98aa0);color:#fff}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:24px;border-radius:16px;display:grid;gap:10px;box-shadow:0 10px 30px -12px #6b2c3e55}
#bar{position:sticky;top:0;z-index:9;background:#fffc;backdrop-filter:blur(10px);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e3c4cf}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}#tabs button{background:#fff;color:#6b2c3e;border:1px solid #e3c4cf;white-space:nowrap}#tabs button.on{background:#6b2c3e;color:#fff}
#root{max-width:900px;margin:0 auto;padding:6px 14px 80px}details{background:#fff;border:1px solid #ecd2da;border-radius:12px;margin:8px 0;padding:8px 12px}summary{cursor:pointer;font-weight:700}
.f{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start;margin:6px 0}.f>label{font-size:.78rem;opacity:.7;word-break:break-all;padding-top:8px}
.obj .obj,.arr .obj{border-inline-start:3px solid #f0d3da;padding-inline-start:10px}.add{background:#f0d3da;color:#6b2c3e;margin:6px 0}.del{background:#d97777;margin-top:8px}
.img{display:flex;flex-direction:column;gap:6px}.img img{max-height:90px;max-width:160px;object-fit:cover;border-radius:8px}.img img[src='']{display:none}
.col{display:flex;gap:6px}.col input[type=color]{width:50px;padding:0;height:38px}.col input.rgb{width:62px;padding:8px 4px;text-align:center}.col{flex-wrap:wrap}.stt{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.stt button{padding:5px 9px;font-size:.78rem;background:#f0d3da;color:#6b2c3e}.stt button.on{background:#6b2c3e;color:#fff}#st{font-size:.85rem}.err{color:#c33}
.msg{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;justify-content:space-between}.msg pre{white-space:pre-wrap;margin:4px 0;font:inherit}
@media(max-width:600px){.f{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><h3>🔐 دخول المشرفة</h3><input id="em" type="email" placeholder="البريد"><input id="pw" type="password" placeholder="كلمة السر"><button onclick="login()">دخول</button><div id="le" class="err"></div></div>
<div id="app" hidden><div id="bar"><button onclick="save()">💾 حفظ ونشر</button><a href="../" target="_blank">عرض الموقع ↗</a><button onclick="out()" style="background:#999">خروج</button><span id="st"></span></div><div id="tabs"></div><div id="root"></div></div>
<script>
const sb=supabase.createClient(SB.url,SB.key),$=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);Object.assign(e,a);e.append(...c);return e};
const st=(m,e)=>{$('#st').textContent=m;$('#st').className=e?'err':''};
const L={cream:'#fbf3f0','cream-2':'#f7e9e6','pink-light':'#f0d3da',pink:'#c98aa0',burgundy:'#6b2c3e','burgundy-dark':'#3f1a26',gold:'#b8935a',ink:'#3a2530',white:'#fffdfc',g1:'#fbf3f0',g2:'#f6dce5',g3:'#ecd9f2'};
const D={cream:'#160d13','cream-2':'#241420','pink-light':'#3d2433',pink:'#e29ab5',burgundy:'#b5476f','burgundy-dark':'#f5dbe5',gold:'#d9b273',ink:'#f3e6ea',white:'#22131c',g1:'#160d13',g2:'#25132a',g3:'#1a1230'};
const TABS=[['products','المنتجات'],['books','الكتب'],['summaries','الملخصات'],['socials','التواصل'],['theme','الألوان والمظهر'],['site','الشعار والواتساب'],['testimonials','نجوم الصديقات'],['promos','أكواد الخصم'],['wilayas','الولايات'],['i18n','النصوص'],['inbox','📥 الرسائل']];
let C,cur='products';
const clone=o=>JSON.parse(JSON.stringify(o));
function seed(c){c.products.forEach(p=>{p.image=p.image||'';(p.colors||[]).forEach(k=>k.image=k.image||'');if(p.hasGender)p.genderPics=p.genderPics||{male:'',female:''}});c.books.forEach(b=>b.image=b.image||'');return c}
function base(){return seed(clone({site:{name:'Dr. Amnesia',logo:'',whatsapp:'213000000000'},theme:{light:L,dark:D},products:PRODUCTS,books:BOOKS,summaries:SUMMARIES,socials:SOCIALS,promos:PROMO_CODES,wilayas:WILAYAS.map(w=>({name:w[0],price:w[1]})),testimonials:TESTIMONIALS,i18n:I18N}))}
function blank(o){if(Array.isArray(o))return[];if(o&&typeof o==='object'){const r={};for(const k in o)r[k]=blank(o[k]);return r}return typeof o==='number'?0:typeof o==='boolean'?false:''}
const lab=p=>p&&typeof p==='object'?((p.name&&(p.name.ar||p.name))||(p.title&&p.title.ar)||(p.label&&p.label.ar)||p.code||p.key||p.ar||p.id||''):String(p);
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/webp',.86)};i.src=URL.createObjectURL(f)})}
async function up(f){const b=await shrink(f),p=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.webp';const{error}=await sb.storage.from('images').upload(p,b,{contentType:'image/webp',cacheControl:'31536000'});if(error)throw error;return sb.storage.from('images').getPublicUrl(p).data.publicUrl}
function ed(v,set,path){
 if(Array.isArray(v)){const w=h('div',{className:'arr'});const draw=()=>{w.innerHTML='';v.forEach((it,i)=>{const d=h('details');d.append(h('summary',{textContent:(i+1)+'. '+lab(it)}),ed(it,x=>{v[i]=x},path),h('button',{className:'del',textContent:'🗑 حذف',onclick:()=>{if(confirm('حذف هذا العنصر؟')){v.splice(i,1);draw()}}}));w.append(d)});
  w.append(h('button',{className:'add',textContent:'＋ إضافة (نسخة فارغة من الأخير)',onclick:()=>{const l=v[v.length-1];v.push(l&&typeof l==='object'?blank(l):'');draw()}}))};draw();return w}
 if(v&&typeof v==='object'){const w=h('div',{className:'obj'});const draw=()=>{w.innerHTML='';for(const k in v)w.append(h('div',{className:'f'},h('label',{textContent:k}),ed(v[k],x=>{v[k]=x},path+'.'+k)));w.append(h('button',{className:'add',textContent:'＋ حقل جديد',onclick:()=>{const k=prompt('اسم الحقل (مثال: image)');if(k){v[k]='';draw()}}}))};draw();return w}
 if(typeof v==='boolean')return h('input',{type:'checkbox',checked:v,style:'width:auto',onchange:e=>set(e.target.checked)});
 if(typeof v==='number')return h('input',{type:'number',value:v,oninput:e=>set(+e.target.value)});
 const s=v??'';
 if(/image|logo|pics/i.test(path)){const im=h('img',{src:s}),i=h('input',{value:s,placeholder:'رابط الصورة (أو ارفع ملفاً)',oninput:e=>{set(e.target.value);im.src=e.target.value}});
  return h('div',{className:'img'},im,i,h('input',{type:'file',accept:'image/*',onchange:async e=>{const f=e.target.files[0];if(!f)return;st('جارٍ رفع الصورة…');try{const u=await up(f);i.value=u;im.src=u;set(u);st('تم الرفع ✓ — اضغط حفظ ونشر')}catch(x){st('فشل الرفع: '+x.message,1)}}}))}
 if(/^#[0-9a-f]{6}$/i.test(s)){const c=h('input',{type:'color',value:s}),t=h('input',{value:s}),H=x=>parseInt(s2(x),16),s2=x=>x;
  const rgb=v=>[1,3,5].map(i=>parseInt(v.slice(i,i+2),16)),hex=a=>'#'+a.map(n=>Math.max(0,Math.min(255,n|0)).toString(16).padStart(2,'0')).join('');
  const ch=['R','G','B'].map((n,i)=>h('input',{type:'number',min:0,max:255,value:rgb(s)[i],title:n,placeholder:n,className:'rgb',oninput:()=>{const v=hex(ch.map(x=>+x.value));c.value=v;t.value=v;set(v)}}));
  const sync=v=>{c.value=v;t.value=v;rgb(v).forEach((n,i)=>ch[i].value=n);set(v)};
  c.oninput=()=>sync(c.value);t.oninput=()=>{/^#[0-9a-f]{6}$/i.test(t.value)&&sync(t.value)};
  return h('span',{className:'col'},c,t,...ch)}
 return s.length>55?h('textarea',{value:s,rows:3,oninput:e=>set(e.target.value)}):h('input',{value:s,oninput:e=>set(e.target.value)})}
async function inbox(r){const{data,error}=await sb.from('submissions').select('*').order('created_at',{ascending:false});if(error)return r.append(error.message);
 if(!data.length)r.append('لا توجد رسائل');data.forEach(m=>{const b=h('div');b.append(h('button',{textContent:'🗑',style:'background:#d97777',onclick:async()=>{await sb.from('submissions').delete().eq('id',m.id);show()}}));
  if(m.type==='star')b.prepend(h('button',{textContent:'✓ نشر النجمة',style:'margin-inline-end:6px',onclick:async()=>{const t=C.testimonials.find(s=>s.id==m.data.id);if(t){Object.assign(t,{status:'approved',name:m.data.name,comment:{ar:m.data.comment,en:m.data.comment,fr:m.data.comment}});await save();await sb.from('submissions').delete().eq('id',m.id);show()}else st('النجمة غير موجودة',1)}}));
  const info=h('div',{},h('b',{textContent:(m.type==='order'?'🛍 طلب #'+m.id:m.type)+' • '+new Date(m.created_at).toLocaleString('ar')+(m.type==='order'?' • '+(m.data.status||'جديد'):'')}),h('pre',{textContent:Object.entries(m.data).filter(([k])=>k!=='status').map(([k,v])=>k+': '+v).join('\n')}));
  if(m.type==='order'){const row=h('div',{className:'stt'});['جديد','مؤكد','تم الشحن','تم التسليم','ملغى'].forEach(x=>row.append(h('button',{textContent:x,className:(m.data.status||'جديد')===x?'on':'',onclick:async()=>{const{error}=await sb.from('submissions').update({data:{...m.data,status:x}}).eq('id',m.id);error?st('فشل: '+error.message,1):show()}})));info.append(row)}
  r.append(h('div',{className:'msg'},info,b))})}
function show(){const r=$('#root');r.innerHTML='';$('#tabs').innerHTML='';TABS.forEach(([k,n])=>$('#tabs').append(h('button',{textContent:n,className:k===cur?'on':'',onclick:()=>{cur=k;show()}})));
 if(cur==='inbox')inbox(r);else r.append(ed(C[cur],x=>C[cur]=x,cur))}
async function save(){st('جارٍ الحفظ…');const{error}=await sb.from('site_content').upsert({id:1,data:C,updated_at:new Date().toISOString()});error?st('فشل: '+error.message,1):st('تم النشر ✓ — الموقع محدّث الآن')}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?$('#le').textContent='بيانات خاطئة':start()}
async function out(){await sb.auth.signOut();location.reload()}
async function start(){const{data:{session}}=await sb.auth.getSession();if(!session)return;$('#login').hidden=true;$('#app').hidden=false;
 const{data}=await sb.from('site_content').select('data').eq('id',1).maybeSingle();C=data?seed(data.data):base();show()}
start();
</script></body></html>
